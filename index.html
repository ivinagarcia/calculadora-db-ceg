<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Mercari JP - Dark Bloom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora Mercari Japão</h1>
        <p>Valores não incluem frete internacional e taxa da RF</p>

        <label for="valorIene">Valor do item no Mercari (¥):</label>
        <input type="number" id="valorIene" placeholder="Ex: 200" step="any">

        <p style="text-align: left; margin-top: 15px; font-size: 14px; color: #666;">
            Cotação efetiva do Iene (c/ IOF): <strong id="textoCotacao">R$ 0,0404</strong>
        </p>

        <button onclick="calcular()">Calcular Total</button>

        <div id="resultado" class="resultado">
            <!-- O resultado vai aparecer aqui -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
